name: CI
on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      - name: Migrate and run RLS isolation tests
        run: |
          psql -v ON_ERROR_STOP=1 -q -f supabase/tests/auth_stub.sql $(ls supabase/migrations/*.sql | grep -v supabase_only | sed 's/^/-f /')
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_isolation.sql | tee rls.log
          grep -q RLS_ISOLATION_ALL_PASSED rls.log
