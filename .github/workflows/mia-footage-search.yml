name: Find free footage for Mia (Pixabay, free)
# Searches Pixabay's free videos with the PIXABAY_KEY secret and prints public preview links (no key in the output).
on:
  workflow_dispatch:
    inputs:
      q: { required: true, default: 'blonde businesswoman talking to camera' }
permissions: { contents: read }
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - env: { K: '${{ secrets.PIXABAY_KEY }}', Q: '${{ inputs.q }}' }
        shell: python
        run: |
          import os, json, urllib.request, urllib.parse
          if not os.environ.get('K'): raise SystemExit('PIXABAY_KEY secret not set yet')
          for q in [os.environ['Q'], 'blonde woman talking camera', 'business woman speaking camera', 'woman video call talking', 'blonde woman interview']:
              u = 'https://pixabay.com/api/videos/?' + urllib.parse.urlencode({'key': os.environ['K'], 'q': q, 'per_page': 30, 'safesearch': 'true'})
              d = json.load(urllib.request.urlopen(u))
              print('### ' + q + ' (' + str(d.get('totalHits')) + ')')
              for h in d.get('hits', []):
                  v = h['videos']; print(json.dumps({'id': h['id'], 'tags': h['tags'], 'page': h['pageURL'], 'dur': h['duration'], 'thumb': v['medium'].get('thumbnail'), 'small': v['small']['url'], 'large': v['large']['url'] or v['medium']['url']}))
