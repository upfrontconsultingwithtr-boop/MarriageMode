name: Keep the free database awake
# Supabase free projects pause after 7 days without requests. Two pings a week keep it on. Free.
on:
  schedule:
    - cron: '17 15 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS https://wdokqitjoeellkwbtdso.supabase.co/auth/v1/health -H "apikey: sb_publishable_6TLLpaZKPtfYJmA1IQDpEA_VJB4ehaz" > /dev/null && echo awake
